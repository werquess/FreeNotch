name: Windows build

on:
  push:
    branches: [windows]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          dotnet publish windows/FreeNotch.Windows/FreeNotch.Windows.csproj `
            -c Release -r win-${{ matrix.arch }} -p:Platform=$platform `
            -o out/FreeNotch

      - uses: actions/upload-artifact@v4
        with:
          name: FreeNotch-Windows-${{ matrix.arch }}
          path: out/FreeNotch
