name: Windows build

on:
  push:
    branches: [windows]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          dotnet publish windows/FreeNotch.Windows/FreeNotch.Windows.csproj `
            -c Release -r win-${{ matrix.arch }} -p:Platform=$platform `
            -o out/FreeNotch

      - uses: actions/upload-artifact@v4
        with:
          name: FreeNotch-Windows-${{ matrix.arch }}
          path: out/FreeNotch

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/FreeNotch.Windows/FreeNotch.Windows.csproj)
          tag="windows-v$version"
          for arch in x64 arm64; do
            (cd "artifacts/FreeNotch-Windows-$arch" && mkdir -p ../pkg-$arch/FreeNotch && cp -r . ../pkg-$arch/FreeNotch && cd ../pkg-$arch && zip -qry "../FreeNotch-Windows-$arch.zip" FreeNotch)
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "FreeNotch for Windows $version (Preview)" \
              --notes "Preview build of FreeNotch for Windows $version. Download FreeNotch-Windows-x64.zip for most PCs or FreeNotch-Windows-arm64.zip for ARM PCs, unzip it and run FreeNotch.exe. Windows 11 required. The app is not signed yet, so SmartScreen may warn: choose More info, then Run anyway."
          fi
          gh release upload "$tag" artifacts/FreeNotch-Windows-x64.zip artifacts/FreeNotch-Windows-arm64.zip --clobber
